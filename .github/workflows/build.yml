name: Jarvis-App bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Das Android SDK ist auf GitHubs Servern schon vorinstalliert.
      - name: APK bauen
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # Zusätzlich als "Release", damit man die APK am Handy direkt herunterladen kann
      - name: Als Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Jarvis.apk --title "Jarvis – neueste Version" \
            --notes "Jarvis.apk antippen, herunterladen und installieren."
