plugins { id 'com.android.application' }

android {
    namespace 'de.aufstehwecker.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.aufstehwecker.app'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        release {
            storeFile file('wecker.keystore')
            storePassword 'aufstehen'
            keyAlias 'wecker'
            keyPassword 'aufstehen'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
